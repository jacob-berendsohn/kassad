name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build-test-pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer reads tag history

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --filter "Category!=Live" --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage"
      - run: dotnet pack --no-build -c Release -o artifacts
        if: matrix.os == 'ubuntu-latest'

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**/*.trx'

  # Live tests hit api.typesafe.ai and only run when the secret is present (never on forks).
  live:
    name: live-api-tests
    if: github.event_name == 'push' && github.repository_owner == '__GITHUB_OWNER__'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test -c Release --filter "Category=Live"
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
