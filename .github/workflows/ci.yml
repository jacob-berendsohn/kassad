name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build-test-pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer reads tag history

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Category!=Live keeps tests that need TYPESAFE_API_KEY out of this job; the live job below runs them.
      # LogFilePrefix, not LogFileName: each test project runs once per TFM, and a fixed file name makes the net8.0 and net10.0 runs overwrite each other.
      - run: dotnet test --no-build -c Release --filter "Category!=Live" --logger "trx;LogFilePrefix=results" --collect:"XPlat Code Coverage"
      # The README's numbers section is generated from eval/results/ (roadmap 4.4): regenerate it and fail if a byte changes,
      # so hand-edited numbers and results files that were re-run without the README (or the other way round) do not merge.
      - run: dotnet run --project eval/Kassad.Eval --no-build -c Release -- report --in eval/results --update-readme README.md
      - run: git diff --exit-code -- README.md
      - run: dotnet pack --no-build -c Release -o artifacts
        if: matrix.os == 'ubuntu-latest'

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**/*.trx'

  # Live tests hit api.typesafe.ai and only run when the secret is present (never on forks).
  live:
    name: live-api-tests
    if: github.event_name == 'push' && github.repository_owner == 'jacob-berendsohn'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test -c Release --filter "Category=Live"
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
